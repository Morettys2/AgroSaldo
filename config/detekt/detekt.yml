# Ajustes do detekt sobre a configuração padrão (buildUponDefaultConfig = true).
# Só o que é diferente do padrão; o resto vale como vem.

naming:
  FunctionNaming:
    # Composable é PascalCase (InicioScreen); nomes de teste vêm entre crases.
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
  MatchingDeclarationName:
    # Vários arquivos juntam um tipo pequeno e a tela que o usa (ex.: UiState + ViewModel).
    active: false

style:
  MagicNumber:
    # Um número que já recebe nome numa propriedade (val/const) não é "mágico"; 100 é percentual e centavos.
    ignorePropertyDeclaration: true
    ignoreNumbers: ['-1', '0', '1', '2', '100']
    # Telas Compose são cheias de dp e sp; testes, de valores de exemplo.
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**', '**/testFixtures/**', '**/ui/theme/**']
  UnusedPrivateMember:
    # Os @Preview (e a multiprévia @PreviasDaTela) são privados e só o Android Studio os chama.
    ignoreAnnotated: ['Preview', 'PreviasDaTela']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    # Funções de validação encadeiam retornos (cada regra devolve o seu motivo); 5 é o teto.
    max: 5
    # Cláusulas de guarda ("se inválido, devolve") no começo da função são o jeito idiomático de validar.
    excludeGuardClauses: true
  UseCheckOrError:
    # Os testes lançam IllegalStateException de propósito para simular falhas.
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**', '**/testFixtures/**']
  WildcardImport:
    active: true

exceptions:
  SwallowedException:
    # Nos testes a exceção esperada é capturada de propósito (`esperado`).
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**']
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**']

complexity:
  LongParameterList:
    # Telas Compose recebem estado e callbacks; o normal é uma lista longa.
    ignoreAnnotated: ['Composable']
    # Construtor com injeção de dependências (ViewModels, serviços) recebe o que usa, e isso soma parâmetros.
    constructorThreshold: 10
    # Os módulos do Hilt só ligam peças: cada parâmetro é um colaborador do que está sendo criado.
    excludes: ['**/di/**']
  LongMethod:
    ignoreAnnotated: ['Composable']
    excludes: ['**/testFixtures/**']
  CyclomaticComplexMethod:
    # Uma tela Compose ramifica por natureza (estado, permissão, bloqueio...).
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    excludes: ['**/test/**', '**/androidTest/**', '**/sharedTest/**']
    # ViewModel tem um método por ação da tela; arquivo de tela junta as partes dela.
    thresholdInClasses: 25
    thresholdInFiles: 25
    thresholdInObjects: 25
