# Integração contínua: todo push e todo PR compilam o app, rodam os testes
# de unidade e o lint. Se algo quebrar, o PR fica vermelho antes do merge.
name: Android

on:
  push:
    branches: [main, "rodada/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar, testar e lint
        id: gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            ${{ vars.GRADLE_TASKS || 'testDebugUnitTest assembleDebug lintDebug' }} 2>&1 | tee build.log

      - name: Erros como anotações
        if: failure()
        run: |
          # Cada bloco vira UMA anotação (o GitHub limita a 10 por passo); %0A é a quebra de linha.
          anotar() { python3 -c 'import sys;t=sys.stdin.read()[-60000:];print("::error title='"$1"'::"+t.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          grep -E '^e: ' build.log | sed "s#file://$GITHUB_WORKSPACE/##" | head -120 | anotar "Erros do Kotlin" || true
          grep -E -A3 'FAILED$|^[A-Za-z]+Test > .* FAILED' build.log | head -150 | anotar "Testes que falharam" || true
          grep -E -B2 -A25 'What went wrong' build.log | head -120 | anotar "Gradle" || true
          tail -60 build.log | anotar "Final do log" || true
          find app/build/reports/lint-results* -name '*.txt' -exec cat {} + 2>/dev/null | head -200 | anotar "Lint" || true

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 7
