# Integração contínua: todo push e todo PR conferem a formatação (ktlint), rodam a análise
# estática (detekt) e os testes, compilam o app e rodam o Android Lint. Se algo quebrar,
# o PR fica vermelho antes do merge.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Escrita só para publicar as capturas de tela na branch ci/capturas.
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar, testar e lint
        id: gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace \
            ${{ vars.GRADLE_TASKS || 'ktlintCheck detekt testDebugUnitTest assembleDebug lintDebug' }} 2>&1 | tee build.log

      - name: Erros como anotações
        if: failure()
        run: |
          # Cada bloco vira UMA anotação (o GitHub limita a 10 por passo); %0A é a quebra de linha.
          anotar() { python3 -c 'import sys;t=sys.stdin.read()[-60000:];print("::error title='"$1"'::"+t.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          grep -E '^e: ' build.log | sed "s#file://$GITHUB_WORKSPACE/##" | head -120 | anotar "Erros do Kotlin" || true
          grep -E -A3 'FAILED$|^[A-Za-z]+Test > .* FAILED' build.log | head -150 | anotar "Testes que falharam" || true
          # Pilha completa das 2 primeiras falhas (o log do Gradle só mostra a primeira linha).
          python3 - <<'PY' | anotar "Detalhe das falhas" || true
          import glob, xml.etree.ElementTree as ET
          n = 0
          for x in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              for caso in ET.parse(x).getroot().iter('testcase'):
                  for f in list(caso.iter('failure')) + list(caso.iter('error')):
                      if n < 2:
                          print(caso.get('classname'), '>', caso.get('name'))
                          print('\n'.join((f.text or '').splitlines()[:45]))
                          print('---')
                      n += 1
          PY
          grep -E -B2 -A25 'What went wrong' build.log | head -120 | anotar "Gradle" || true
          grep -qE '^e: |FAILED$' build.log || tail -60 build.log | anotar "Final do log" || true
          find app/build/reports/lint-results* -name '*.txt' -exec cat {} + 2>/dev/null | head -200 | anotar "Lint" || true

      - name: Resumo
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=s=0
          for x in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r=ET.parse(x).getroot(); t+=int(r.get('tests',0)); f+=int(r.get('failures',0))+int(r.get('errors',0)); s+=int(r.get('skipped',0))
          avisos={}
          for x in glob.glob('app/build/reports/lint-results*.xml'):
              for i in ET.parse(x).getroot().iter('issue'):
                  k=i.get('severity')+' '+i.get('id'); avisos[k]=avisos.get(k,0)+1
          kt=sum(1 for l in open('build.log', errors='ignore') if l.startswith('w: '))
          linhas=[f"Testes: {t} ({f} falhas, {s} ignorados)", f"Avisos do Kotlin: {kt}", "Lint: "+(", ".join(f"{v}x {k}" for k,v in sorted(avisos.items())) or "nada")]
          print("::notice title=Resumo::"+"%0A".join(linhas))
          PY
          grep -E '^w: ' build.log | sed "s#file://$GITHUB_WORKSPACE/##" | head -80 | python3 -c 'import sys;t=sys.stdin.read();t and print("::warning title=Avisos do Kotlin::"+t.replace("%","%25").replace("\n","%0A"))'

      - name: Publicar capturas de tela
        # As imagens das telas (CapturasDeTelaTest) vão para a branch ci/capturas, para revisar o
        # visual de um PR sem emulador: é só abrir a branch no GitHub.
        if: always() && hashFiles('app/build/capturas/*.png') != ''
        run: |
          mkdir -p /tmp/capturas && cp app/build/capturas/*.png /tmp/capturas/
          cd /tmp/capturas
          git init -q -b ci/capturas
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Capturas de ${{ github.head_ref || github.ref_name }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/capturas

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorios
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 7
